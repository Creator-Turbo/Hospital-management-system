<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2v4"></path>
                        <path d="M16 2v4"></path>
                        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                        <path d="M3 10h18"></path>
                        <path d="M9 16h6"></path>
                        <path d="M12 13v6"></path>
                    </svg>
                </div>
                <span class="logo-text">HMS</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="9" x="3" y="3" rx="1"></rect>
                        <rect width="7" height="5" x="14" y="3" rx="1"></rect>
                        <rect width="7" height="9" x="14" y="12" rx="1"></rect>
                        <rect width="7" height="5" x="3" y="16" rx="1"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="patients.html" class="nav-link" data-role="admin,doctor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Patients</span>
                </a>
                <a href="doctors.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <path d="M9 9h.01"></path>
                        <path d="M15 9h.01"></path>
                    </svg>
                    <span>Doctors</span>
                </a>
                <a href="appointments.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2v4"></path>
                        <path d="M16 2v4"></path>
                        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                        <path d="M3 10h18"></path>
                    </svg>
                    <span>Appointments</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block" id="logoutBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" x2="9" y1="12" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12"></line>
                        <line x1="4" x2="20" y1="6" y2="6"></line>
                        <line x1="4" x2="20" y1="18" y2="18"></line>
                    </svg>
                </button>
                
                <div class="header-title">
                    <h1>Doctors</h1>
                    <p>View and manage doctors</p>
                </div>
                
                <div class="header-actions">
                    <div class="user-badge" id="userBadge">
                        <span class="badge badge-primary" id="userRole">Role</span>
                    </div>
                </div>
            </header>
            
            <!-- Content Area -->
            <div class="content-area">
                <!-- Search and Filter Bar -->
                <div class="toolbar">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search doctors...">
                    </div>
                    <div class="filter-group">
                        <select id="specializationFilter">
                            <option value="">All Specializations</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Psychiatry">Psychiatry</option>
                            <option value="Ophthalmology">Ophthalmology</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addDoctorBtn" data-role="admin" style="display: none;" onclick="openAddDoctorModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14"></path>
                            <path d="M5 12h14"></path>
                        </svg>
                        <span>Add Doctor</span>
                    </button>
                </div>
                
                <!-- Doctors Grid -->
                <div class="doctors-grid" id="doctorsGrid">
                    <div class="loading-state">Loading doctors...</div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- View Doctor Modal -->
    <div class="modal" id="doctorModal">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Doctor Details</h2>
                <button class="modal-close" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="doctor-profile">
                    <div class="doctor-avatar" id="doctorAvatar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <path d="M9 9h.01"></path>
                            <path d="M15 9h.01"></path>
                        </svg>
                    </div>
                    <div class="doctor-info">
                        <h3 id="doctorName">Dr. Name</h3>
                        <p class="specialization" id="doctorSpecialization">Specialization</p>
                    </div>
                </div>
                
                <div class="detail-list">
                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="doctorEmail">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" id="doctorPhone">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">License Number</span>
                        <span class="detail-value" id="doctorLicense">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Available Days</span>
                        <span class="detail-value" id="doctorAvailableDays">-</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
                <a href="#" class="btn btn-primary" id="bookWithDoctorBtn">Book Appointment</a>
            </div>
        </div>
    </div>
    
    <!-- Add Doctor Modal (Admin Only) -->
    <div class="modal" id="addDoctorModal">
        <div class="modal-backdrop" onclick="closeAddDoctorModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Doctor</h2>
                <button class="modal-close" onclick="closeAddDoctorModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="addDoctorForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newDoctorName">Full Name *</label>
                            <input type="text" id="newDoctorName" required placeholder="Enter full name">
                        </div>
                        <div class="form-group">
                            <label for="newDoctorEmail">Email *</label>
                            <input type="email" id="newDoctorEmail" required placeholder="Enter email">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newDoctorPassword">Password *</label>
                            <input type="password" id="newDoctorPassword" required placeholder="Enter password" minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="newDoctorPhone">Phone</label>
                            <input type="tel" id="newDoctorPhone" placeholder="Enter phone number">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newDoctorSpecialization">Specialization *</label>
                            <select id="newDoctorSpecialization" required>
                                <option value="">Select specialization</option>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Psychiatry">Psychiatry</option>
                                <option value="Ophthalmology">Ophthalmology</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="newDoctorLicense">License Number *</label>
                            <input type="text" id="newDoctorLicense" required placeholder="Enter license number">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="newDoctorAvailableDays">Available Days</label>
                        <input type="text" id="newDoctorAvailableDays" placeholder="e.g., Mon, Tue, Wed, Thu, Fri">
                    </div>
                    
                    <div id="addDoctorError" class="error-message" style="display: none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddDoctorModal()">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveDoctorBtn" onclick="saveNewDoctor()">
                    <span class="btn-text">Add Doctor</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/doctors.js"></script>
</body>
</html>
