<!-- ai-assistant.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant - HMS</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/ai-assistant.css" />
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M8 2v4"></path>
                        <path d="M16 2v4"></path>
                        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                        <path d="M3 10h18"></path>
                        <path d="M9 16h6"></path>
                        <path d="M12 13v6"></path>
                    </svg>
                </div>

                <span class="logo-text">HMS</span>
            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-link">
                    <span>Dashboard</span>
                </a>

                <a href="patients.html" class="nav-link">
                    <span>Patients</span>
                </a>

                <a href="doctors.html" class="nav-link">
                    <span>Doctors</span>
                </a>

                <a href="appointments.html" class="nav-link">
                    <span>Appointments</span>
                </a>

                <a href="ai-assistant.html" class="nav-link active">
                    <span>AI Assistant</span>
                </a>

            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block">
                    Logout
                </button>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main-content ai-main-content">

            <!-- Header -->
            <header class="ai-header">

                <div class="ai-header-left">

                    <button class="menu-toggle" id="menuToggle">
                        ☰
                    </button>

                    <div>
                        <h1>AI Assistant</h1>
                        <p>Your smart healthcare assistant</p>
                    </div>

                </div>

            </header>

            <!-- Chat Container -->
            <div class="chat-wrapper">

                <!-- Chat Messages -->
                <div class="chat-messages" id="chatMessages">

                    <!-- AI Message -->
                    <div class="message ai-message">

                        <div class="message-avatar ai-avatar">
                            AI
                        </div>

                        <div class="message-content">
                            Hello 👋 <br><br>
                            I am your HMS AI Assistant.
                            How can I help you today?
                        </div>

                    </div>

                    <!-- User Message -->
                    <div class="message user-message">

                        <div class="message-content">
                            Show today's appointments
                        </div>

                        <div class="message-avatar user-avatar">
                            U
                        </div>

                    </div>

                    <!-- AI Reply -->
                    <div class="message ai-message">

                        <div class="message-avatar ai-avatar">
                            AI
                        </div>

                        <div class="message-content">
                            You have 12 appointments scheduled for today.
                        </div>

                    </div>

                </div>

                <!-- Input Area -->
                <div class="chat-input-container">

                    <div class="chat-input-box">

                        <textarea
                            id="messageInput"
                            placeholder="Type your message here..."
                        ></textarea>

                        <button id="sendBtn">
                            Send
                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>

  <script src="js/ai.js"></script>
